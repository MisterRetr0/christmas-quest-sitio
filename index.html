<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
  <meta name="theme-color" content="#14101F">
  <title>La última misión antes de Navidad</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Pirata+One&family=Cinzel+Decorative:wght@400;700&family=IM+Fell+English:ital@0;1&family=Press+Start+2P&family=Nunito:wght@600;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/base.css">
  <link rel="stylesheet" href="css/ui.css">
  <link rel="stylesheet" href="css/scenes.css">
  <!-- three.js 0.160.0: solo se descarga al montar el capítulo 5 (import dinámico) -->
  <script type="importmap">
  { "imports": {
    "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
    "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"
  } }
  </script>
</head>
<body>
  <!-- Defs SVG globales (A1 §5b): usables desde cualquier SVG inline con url(#id) -->
  <svg class="svg-defs" width="0" height="0" aria-hidden="true" focusable="false">
    <defs>
      <!-- #inkWobble: temblor de linograbado (estático) -->
      <filter id="inkWobble" x="-5%" y="-5%" width="110%" height="110%">
        <feTurbulence type="fractalNoise" baseFrequency="0.035" numOctaves="2" seed="7" result="n"/>
        <feDisplacementMap in="SourceGraphic" in2="n" scale="3.5" xChannelSelector="R" yChannelSelector="G"/>
      </filter>
      <!-- #hatch45: líneas de tinta a 45°, paso 6 px, trazo 1.5 px -->
      <pattern id="hatch45" width="6" height="6" patternUnits="userSpaceOnUse" patternTransform="rotate(45)">
        <line x1="0" y1="0" x2="0" y2="6" stroke="#1B1420" stroke-width="1.5"/>
      </pattern>
      <pattern id="hatch45Light" width="6" height="6" patternUnits="userSpaceOnUse" patternTransform="rotate(45)">
        <line x1="0" y1="0" x2="0" y2="6" stroke="#1B1420" stroke-width="1.5" opacity=".5"/>
      </pattern>
    </defs>
  </svg>
  <!-- Escenario vertical 9:16; en escritorio queda centrado con bordes (letterbox) -->
  <main id="stage" aria-label="La última misión antes de Navidad">
    <!-- Cada capítulo se monta como una "página" de papel dentro de #scenes -->
    <div id="scenes"></div>
    <canvas id="snow" aria-hidden="true"></canvas>
    <div id="fxlayer" aria-hidden="true"></div>
    <div class="vignette" aria-hidden="true"></div>

    <!-- Barra superior: guirnalda de progreso, dijes y sonido -->
    <header id="topbar">
      <nav id="garland" aria-label="Progreso de la aventura"></nav>
      <div id="hud-pandoras" hidden aria-label="Pandoras ganadas">
        <svg viewBox="0 0 32 32" width="26" height="26" aria-hidden="true">
          <!-- dije dorado redondo con cajita entreabierta grabada -->
          <circle cx="16" cy="17" r="12.5" fill="#E8C25A" stroke="#1B1420" stroke-width="2"/>
          <circle cx="16" cy="17" r="9.6" fill="none" stroke="#B88A2C" stroke-width=".8" opacity=".7"/>
          <path d="M16 1.5a3.2 3.2 0 0 1 3.2 3.2v1.6h-6.4V4.7A3.2 3.2 0 0 1 16 1.5z" fill="none" stroke="#B88A2C" stroke-width="1.6"/>
          <rect x="10.5" y="17" width="11" height="6.6" rx="1" fill="none" stroke="#8A6118" stroke-width="1.3"/>
          <path d="M10 16.4 L21.2 13.6" stroke="#8A6118" stroke-width="1.4" stroke-linecap="round"/>
          <path d="M16 17.4v6" stroke="#8A6118" stroke-width=".9"/>
        </svg>
        <span id="pandoras-count">0</span>
      </div>
      <button id="sound-btn" type="button" aria-label="Sonido activado. Toca para silenciar; mantén pulsado para el volumen">
        <svg viewBox="0 0 24 24" width="24" height="24" aria-hidden="true">
          <path d="M3 9v6h4l5 4V5L7 9H3z" fill="currentColor"/>
          <g class="waves" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round">
            <path d="M15.5 8.5a5 5 0 0 1 0 7"/><path d="M18 6a8.5 8.5 0 0 1 0 12"/>
          </g>
          <path class="mute-x" d="M15 9l6 6M21 9l-6 6" stroke="currentColor" stroke-width="2" stroke-linecap="round"/>
        </svg>
      </button>
      <div id="vol-pop" hidden role="group" aria-label="Volumen">
        <label for="vol-range">Volumen</label>
        <input id="vol-range" type="range" min="0" max="100" step="1" value="70">
      </div>
    </header>

    <!-- Parte inferior: narración, atrás, saltar y CONTINUAR -->
    <footer id="dock">
      <button id="skip-btn" type="button" class="btn--ghost" hidden>Saltar ⏭</button>
      <div id="narration" class="dialog" aria-live="polite" aria-atomic="true"></div>
      <button id="back-btn" type="button">‹ atrás</button>
      <button id="next-btn" type="button" class="btn">CONTINUAR</button>
    </footer>

    <div id="sheet-shadow" aria-hidden="true"></div>
    <div class="grain" aria-hidden="true"></div>
    <div id="modal-root"></div>
  </main>

  <noscript><p style="color:#EFE3CC;padding:2rem">Esta carta necesita JavaScript para abrirse.</p></noscript>
  <script type="module" src="js/main.js"></script>
</body>
</html>
